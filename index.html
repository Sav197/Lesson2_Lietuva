{id:1,title:'Особи та дієвідміни',lt:'Asmuo ir asmenuotė',icon:'people',color:'blue',time:'5 хв',pages:'7–8, 14',desc:'Повторюємо būti й визначаємо дієвідміну за правильною формою.',body:`<p>Форма дієслова залежить від того, <b>хто виконує дію</b>. Почнемо зі знайомого būti — «бути».</p>${MROWS([['aš esu · tu esi','я є · ти є'],['jis / ji yra','він / вона є'],['mes esame · jūs esate','ми є · ви є'],['jie / jos yra','вони є']])}<p class="note">У третій особі <b>одна форма</b> і для однини, і для множини: jis dirba, ji dirba, jie dirba, jos dirba.</p><h3>Три дієвідміни</h3><p>Дивимося на <b>3-тю особу теперішнього часу</b>, а не на інфінітив чи минулий час.</p>${MROWS([['I · -a / -ia','dirba, gyvena, kalba, studijuoja, supranta'],['II · -i','nori, myli, žiūri — для розпізнавання типу'],['III · -o','mato, daro, žino — для розпізнавання типу']])}<div class="note"><b>Уточнення до с. 8:</b> studijuoja закінчується на <b>-a</b> й належить до I дієвідміни. Приклади III дієвідміни: mato, daro, žino. Дієслово būti має особливі форми — їх запам’ятовуємо окремо.</div>`},
{id:2,title:'Я живу, ви працюєте',lt:'Esamasis laikas',icon:'bolt',color:'orange',time:'8 хв',pages:'9–13',desc:'П’ять дієслів у всіх особах. Натискайте й порівнюйте.',body:`<p>За основу беріть форму 3-ї особи: <b lang="lt">gyvena → gyven-</b>, <b lang="lt">supranta → suprant-</b>. У цих п’яти дієсловах закінчення повторюються.</p>${MROWS([['aš → -u · tu → -i','gyvenu · gyveni'],['jis / ji / jie / jos → -a','gyvena'],['mes → -ame · jūs → -ate','gyvename · gyvenate']])}<div id="verbExplorer"></div><p class="note"><b lang="lt">Studijuoju</b> = studijuoj- + -u; <b lang="lt">studijuojate</b> = studijuoj- + -ate. Літера j належить до основи. <b lang="lt">Suprantu</b> зберігає основу suprant-.</p><h3>Промовте про себе</h3><div class="example" lang="lt">Aš gyvenu Kaune.<br>Aš dirbu universitete.</div><p>Я живу в Каунасі. Я працюю в університеті. Значення форм Kaune та universitete розберемо в блоці «Де?».</p>`},
{id:3,title:'Навіщо словам відмінки?',lt:'Daiktavardžio linksniai',icon:'letters',color:'violet',time:'5 хв',pages:'16–17',desc:'Огляд семи відмінків і головних питань.',body:`<p>Закінчення іменника допомагає зрозуміти його роль у реченні. У литовській <b>сім відмінків</b>.</p>${MROWS(CASES.map(c=>[c[0]+' · '+c[2],c[1]+' — '+c[3]]))}<div class="note">Литовське <b lang="lt">kas?</b> охоплює і «хто?», і «що?». Для кличного головне — <b>звертання</b>, а не окреме відмінкове питання.</div><details><summary>Приклад усіх відмінків: namas</summary>${MROWS(CASES.map(c=>[c[4],c[0]+' — '+c[1]]))}<p>Це довідковий приклад для структури таблиці. Не потрібно переносити його закінчення на всі іменники.</p></details><h3>Фокус уроку 2</h3>${MROWS([['iš kur? → iš + kilmininkas','звідки? → з / із + родовий'],['kur? → vietininkas','де? → місцевий без прийменника «в»']])}<p class="note">Відмінювання залежить від типу іменника. Наприклад: <b lang="lt">brolis → brolio</b>, але <b lang="lt">pilis → pilies</b>. Одного закінчення -is недостатньо, щоб завжди обрати -io.</p>`},
{id:4,title:'Звідки ви? — Iš kur?',lt:'Iš + kilmininkas',icon:'repeat',color:'green',time:'6 хв',pages:'15, 18, 20',desc:'Походження, прийменник iš і родовий відмінок.',body:`<div class="example" lang="lt">Iš kur jūs esate?<br>Aš esu iš Ukrainos.</div><p>Звідки Ви? Я з України. <b lang="lt">Iš</b> вживається з родовим відмінком. Також може позначати рух із приміщення або іншого місця.</p>${MROWS([['-as → -o · Kaunas → iš Kauno','Каунас → з Каунаса'],['-is → -io · Rokiškis → iš Rokiškio','Рокишкіс → з Рокишкіса'],['-ys → -io · Panevėžys → iš Panevėžio','Паневежис → з Паневежиса'],['-a → -os · Nida → iš Nidos','Ніда → з Ніди'],['-ė → -ės · Plungė → iš Plungės','Плунге → з Плунге'],['-us → -aus · Alytus → iš Alytaus','Алітус → з Алітуса']])}<p class="note">Це моделі для поданих типів слів. Окремо: <b lang="lt">Vilnius → iš Vilniaus</b>; <b lang="lt">Šiauliai → iš Šiaulių</b> (множина).</p><h3>Фрази, які знадобляться</h3>${MROWS([['Iš kur tu esi?','Звідки ти? — неформально'],['Iš kur jūs esate?','Звідки Ви? — ввічливо'],['iš universiteto · iš darbo','з університету · з роботи']])}<p>Порівняйте: <b lang="lt">Lietuva → iš Lietuvos</b>, <b lang="lt">Ukraina → iš Ukrainos</b>.</p>`},
{id:5,title:'Де ви? — Kur?',lt:'Vietininkas',icon:'home',color:'blue',time:'6 хв',pages:'19–20',desc:'Місце перебування, проживання й роботи.',body:`<div class="example" lang="lt">Kur jūs dabar esate?<br>Mes esame senamiestyje.</div><p>Де Ви зараз? Ми в старому місті. Місцевий відмінок відповідає на <b lang="lt">kur?</b> — «де?».</p>${MROWS([['-as → -e · Kaunas → Kaune','у Каунасі'],['-is → -yje · Rokiškis → Rokiškyje','у Рокишкісі'],['-ys → -yje · Panevėžys → Panevėžyje','у Паневежисі'],['-a → -oje · Nida → Nidoje','у Ніді'],['-ė → -ėje · Plungė → Plungėje','у Плунге'],['-us → -uje · Alytus → Alytuje','в Алітусі']])}<div class="note">В українському перекладі є «в / у», а литовською в цих реченнях достатньо самого місцевого: <b lang="lt">gyvenu Kaune</b>. Не додавайте iš, коли відповідаєте на «де?».</div>${MROWS([['Vilniuje · Šiauliuose','у Вільнюсі · у Шяуляї'],['universitete · senamiestyje','в університеті · у старому місті'],['darbe · mieste','на роботі · у місті']])}<h3>Одна назва — різний зміст</h3><div class="contrast"><div><span>ЗВІДКИ?</span><b lang="lt">iš Kauno</b><small>з Каунаса</small></div><div><span>ДЕ?</span><b lang="lt">Kaune</b><small>у Каунасі</small></div></div>`},
{id:6,title:'Країни та міста',lt:'Šalys ir miestai',icon:'match',color:'orange',time:'7 хв',pages:'18–21',desc:'Перетворюйте назви: називний → звідки → де.',body:`<p>Оберіть назву з таблиці уроку й порівняйте три форми. Після цього сховайте відповіді та відновіть їх із пам’яті.</p><div id="placeExplorer"></div><div class="note"><b>Важливі випадки:</b> Vilnius → Vilniaus → Vilniuje; Tokijas → Tokijo → Tokijuje; Šiauliai → Šiaulių → Šiauliuose.</div><p>У довіднику є всі географічні назви із с. 21 та міста з таблиць закінчень. Для Києва використано <b lang="lt">Kyjivas</b>; варіант із PDF <b lang="lt">Kijevas</b> також пояснено.</p><p class="small muted">Слово Amerika збережено як у PDF. Це географічна назва, а не точна офіційна назва держави США. У вправах тренуємо мовні форми, а не політичну географію.</p>`},
{id:7,title:'Розповідаю про себе',lt:'Kalbu apie save',icon:'chat',color:'violet',time:'6 хв',pages:'6, 9–15, 18–21 + додаткова практика',desc:'Поєднуємо дієслова, походження, місце та мову.',body:`<div class="example" lang="lt">Aš esu iš Ukrainos.<br>Dabar gyvenu Kaune.<br>Dirbu universitete.<br>Šiek tiek kalbu lietuviškai.</div><p>Я з України. Зараз живу в Каунасі. Працюю в університеті. Трохи говорю литовською.</p><p class="note">Це зразок. Замініть інформацію на свою. Займенник aš можна опускати, коли особа зрозуміла з дієслова. У тренажері складайте речення з поданих слів; допустимі варіанти порядку слів враховано.</p>${MROWS([['Kur jūs gyvenate?','Де Ви живете?'],['Kur tu dirbi?','Де ти працюєш?'],['Ar jūs kalbate lietuviškai?','Ви говорите литовською?'],['Taip, suprantu. / Aš nesuprantu.','Так, розумію. / Я не розумію.']])}<h3>Трохи додаткової практики</h3>${MROWS([['lietuviškai · ukrainietiškai · angliškai','литовською · українською · англійською'],['šiek tiek','трохи'],['Jis kalba angliškai.','Він говорить англійською.'],['Prašau mane visada pataisyti.','Будь ласка, завжди виправляйте мене.']])}<p class="small muted">Додаткові фрази та моделі підібрано за темами 50languages «Країни і мови» й «Вивчення іноземних мов». Основна граматика — з вашого PDF.</p>`}
];
const QUESTIONS=[];
function choice(id,m,q,a,opts,explain,tag='core'){QUESTIONS.push({id,m,type:'choice',q,a,opts:[a,...opts].filter((v,i,arr)=>arr.indexOf(v)===i),explain,tag});}
function build(id,m,q,a,extra,explain,aliases=[]){QUESTIONS.push({id,m,type:'build',q,a,tokens:[...a.replace(/[.!?]/g,'').split(' '),...extra],explain,aliases,tag:'sentence'});}
function typing(id,m,q,a,explain,aliases=[]){QUESTIONS.push({id,m,type:'type',q,a,aliases,explain,tag:'writing'});}
VERBS.forEach(v=>{
 choice('meaning-'+v.id,0,`Що означає ${v.inf}?`,v.uk,VERBS.filter(x=>x.id!==v.id).slice(0,3).map(x=>x.uk),`${v.inf}, ${v.present}, ${v.past} — ${v.uk}.`);
 choice('inf-'+v.id,0,`Оберіть інфінітив дієслова «${v.uk}».`,v.inf,[v.present,v.past,v.forms[0]],'Інфінітив відповідає на «що робити?».');
 choice('past-'+v.id,0,`Яка форма минулого часу (3-тя особа) належить до ${v.inf}?`,v.past,[v.inf,v.present,v.forms[0]],`${v.inf} → ${v.present} → ${v.past}. Минулий час зараз лише впізнаємо.`);
 PERSONS.forEach(([pron,ua,i],idx)=>choice(`verb-${v.id}-${idx}`,2,`Теперішній час: ${pron} ___ (${v.inf}).`,v.forms[i],v.forms.filter(x=>x!==v.forms[i]).slice(0,3),`${pron} ${v.forms[i]}. ${v.note}`,'verb'));
 typing('write-'+v.id,2,`Напишіть форму для aš: ${v.inf}.`,v.forms[0],`Aš ${v.forms[0]}. ${v.note}`);
});

[['dirba','I · -a / -ia'],['gyvena','I · -a / -ia'],['kalba','I · -a / -ia'],['studijuoja','I · -a / -ia'],['supranta','I · -a / -ia'],['nori','II · -i'],['myli','II · -i'],['žiūri','II · -i'],['mato','III · -o'],['daro','III · -o'],['žino','III · -o']].forEach(([v,a],i)=>choice('class-'+i,1,`До якої дієвідміни належить форма ${v}?`,a,['I · -a / -ia','II · -i','III · -o'].filter(x=>x!==a),'Визначаємо за кінцем 3-ї особи теперішнього часу. Studijuoja має -a, а не -o.','class'));

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(s){return esc(s);}
function button(label,action,value='',cls='btn'){return `<button class="${cls}" data-action="${action}" data-value="${attr(value)}" ${cls==='icon-btn'?'aria-label="Назад або вийти"':''}>${label}</button>`;}
function audioButton(text){return `<button class="icon-btn" data-action="speak" data-value="${attr(text)}" aria-label="Послухати: ${attr(text)}">${icon('sound')}</button>`;}
function today(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayOffset(n){const d=new Date();d.setDate(d.getDate()+n);return today(d);}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).normalize('NFC').toLocaleLowerCase('lt').replace(/[.,!?…:;“”"„]/g,'').replace(/\s+/g,' ').trim();}
function loose(s){return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function validNum(v,min,max,fallback){return typeof v==='number'&&Number.isFinite(v)?Math.min(max,Math.max(min,v)):fallback;}
function validateState(raw){
 if(!raw||raw.schema!==1||raw.lesson!==2)throw Error('Це не файл прогресу уроку 2.');
 const s=defaults();s.xp=Math.floor(validNum(raw.xp,0,1e7,0));s.sessions=Math.floor(validNum(raw.sessions,0,1e6,0));s.examBest=validNum(raw.examBest,0,100,0);
 if(raw.settings&&typeof raw.settings==='object'){const x=raw.settings;s.settings={name:typeof x.name==='string'?x.name.slice(0,60):'',goal:[5,10,15,20].includes(x.goal)?x.goal:10,rate:validNum(x.rate,.65,1.1,.85),sound:x.sound===true,large:x.large===true,reminder:/^([01]\d|2[0-3]):[0-5]\d$/.test(x.reminder)?x.reminder:'19:00'};}
 s.favorites=Array.isArray(raw.favorites)?[...new Set(raw.favorites)].filter(id=>WORDS.some(w=>w.id===id)):[];
 s.mistakes=Array.isArray(raw.mistakes)?[...new Set(raw.mistakes)].filter(id=>QUESTIONS.some(q=>q.id===id)):[];
 for(const m of MODULES){if(raw.completed&&raw.completed[m.id])s.completed[m.id]=Math.round(validNum(raw.completed[m.id],0,100,0));if(raw.read&&raw.read[m.id])s.read[m.id]=true;}
 if(raw.cards&&typeof raw.cards==='object')for(const w of WORDS){const c=raw.cards[w.id];if(c&&typeof c==='object'){s.cards[w.id]={level:Math.floor(validNum(c.level,0,5,0)),due:validNum(c.due,0,Date.now()+366*DAY,Date.now()),reviews:Math.floor(validNum(c.reviews,0,1e6,0))};}}
 if(raw.days&&typeof raw.days==='object')for(const [date,val] of Object.entries(raw.days).slice(-1000)){if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&val&&typeof val==='object')s.days[date]={attempts:Math.floor(validNum(val.attempts,0,1e6,0)),correct:Math.floor(validNum(val.correct,0,1e6,0)),xp:Math.floor(validNum(val.xp,0,1e7,0))};}
 return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}document.getElementById('storageNotice').hidden=storageOK;}
function award(correct,xp=correct?10:2){const d=today();if(!state.days[d])state.days[d]={attempts:0,correct:0,xp:0};state.days[d].attempts++;if(correct)state.days[d].correct++;state.days[d].xp+=xp;state.xp+=xp;save();renderStats();}
function streak(){let n=0;let offset=state.days[today()]?.attempts?0:-1;while(state.days[dayOffset(offset)]?.attempts){n++;offset--;}return n;}
function mastered(){return WORDS.filter(w=>(state.cards[w.id]?.level||0)>=3).length;}
function dueWords(){return WORDS.filter(w=>state.cards[w.id]&&state.cards[w.id].due<=Date.now()).sort((a,b)=>state.cards[a.id].due-state.cards[b.id].due);}
function newWords(){return WORDS.filter(w=>!state.cards[w.id]);}
function updateCard(id,rating){if(!WORDS.some(w=>w.id===id))return;const old=state.cards[id]||{level:0,reviews:0,due:0};let level=rating===0?0:Math.min(5,old.level+(rating===2?2:1));const delays=[600000,DAY,3*DAY,7*DAY,14*DAY,30*DAY];state.cards[id]={level,due:Date.now()+delays[level],reviews:old.reviews+1};save();}

function renderPlaceExplorer(){const box=document.getElementById('placeExplorer');if(!box)return;const p=PLACES[selectedPlace];const groups=[['core','Основні'],['countries','Країни'],['cities','Міста'],['places','Місця']];let filtered=PLACES.map((p,i)=>({...p,i})).filter(p=>placeGroup==='core'?p.level==='core':p.cat===placeGroup);box.innerHTML=`<section class="grammar-panel"><div class="chips">${groups.map(([id,t])=>button(t,'place-group',id,'chip '+(id===placeGroup?'active':''))).join('')}</div><label for="placeSelect" class="small"><b>Оберіть назву</b></label><select id="placeSelect" style="margin-top:8px">${filtered.map(p=>`<option value="${p.i}" ${p.i===selectedPlace?'selected':''}>${p.nom} — ${p.uk}</option>`).join('')}</select><div class="form-result"><span class="eyebrow muted">НАЗИВНИЙ · VARDININKAS</span><h2 lang="lt">${p.nom}</h2><p>${p.uk}</p>${audioButton(p.nom)}</div>${placeVisible?`<div class="case-forms"><div><span class="eyebrow">IŠ KUR? · ЗВІДКИ?</span><b lang="lt">iš ${p.gen}</b><small>Родовий · kilmininkas</small>${audioButton('iš '+p.gen)}</div><div><span class="eyebrow">KUR? · ДЕ?</span><b lang="lt">${p.loc}</b><small>Місцевий · vietininkas</small>${audioButton(p.loc)}</div></div><p class="small muted" style="margin:12px 0">${p.note||'Порівняйте закінчення. Iš вимагає родового, а перебування позначає місцевий.'}</p>`:'<div class="note center">Згадайте: <b>iš …</b> та <b>kur? …</b><br>Промовте обидві форми без підказки.</div>'}${button(placeVisible?'Сховати форми й пригадати':'Показати правильні форми','place-toggle','','btn soft full')}</section><details><summary>Усі назви цієї добірки (${filtered.length})</summary><div class="place-reference">${filtered.map(x=>`<div><b lang="lt">${x.nom}</b><span class="small muted">${x.uk}</span><div class="row wrap small"><span lang="lt">iš <b>${x.gen}</b></span><span lang="lt">→ <b>${x.loc}</b></span></div></div>`).join('')}</div></details>`;}
function placeDesk(){page='places';paint(`${subhead('Звідки? Де?','nav','practice')}${heading('ТРЕНАЖЕР ВІДМІНКІВ','Звідки → де','Порівняйте форми з таблиць уроку та потренуйте їх у реченнях.')}<div id="placeExplorer"></div><div class="stack" style="margin-top:20px">${button('Звідки? · 10 вправ','quiz','genitive','btn primary full')}${button('Де? · 10 вправ','quiz','locative','btn full')}</div>`,true);renderPlaceExplorer();}

function filteredWords(){return WORDS.filter(w=>(wordFilter==='all'||(wordFilter==='star'?state.favorites.includes(w.id):wordFilter.startsWith('module:')?w.m===Number(wordFilter.split(':')[1]):w.cat===wordFilter))&&(!wordQuery||loose(w.lt+' '+w.uk).includes(loose(wordQuery))));}
function renderWords(focus=false){const filters=[['all','Усі'],['star','★ Обрані'],...Object.entries(CATEGORIES).filter(([cat])=>WORDS.some(w=>w.cat===cat))];paint(`${heading('СЛОВНИК УРОКУ','Слово за словом',`${WORDS.length} слів і фраз. Обирайте тему та вчіть невеликими порціями.`)}<label class="sr-only" for="wordSearch">Пошук українською або литовською</label><input id="wordSearch" class="search" placeholder="Знайти слово…" value="${attr(wordQuery)}" type="search" autocomplete="off"><div class="spacer"></div><div class="chips">${filters.map(([id,label])=>button(label,'filter',id,'chip '+(wordFilter===id?'active':''))).join('')}</div>${wordFilter.startsWith('module:')?`<p class="small muted">Блок: ${MODULES[Number(wordFilter.split(':')[1])].title}</p>`:''}<div class="row" style="margin:8px 0 15px">${button(icon('repeat')+' Вчити картки','cards-filter','','btn primary grow')}${button(wordDirection==='lt'?'LT → UA':'UA → LT','direction','','btn')}</div><p class="mode-note">Оберіть напрямок на кнопці. Відкрийте відповідь перед оцінкою картки.</p><div id="wordList"></div>`,focus);renderWordList();}
function renderWordList(){const list=document.getElementById('wordList');if(!list)return;const data=filteredWords();list.innerHTML=`<div class="word-count">Знайдено: ${data.length}</div>`+(data.length?data.map(w=>`<article class="word-item"><div class="grow"><b lang="lt">${esc(w.lt)}</b>${w.gender?`<span class="tiny-tag">${w.gender==='m'?'чол.':'жін.'}</span>`:''}<p>${esc(w.uk)}</p></div>${audioButton(w.lt)}<button class="icon-btn ${state.favorites.includes(w.id)?'liked':''}" data-action="favorite" data-value="${w.id}" aria-pressed="${state.favorites.includes(w.id)}" aria-label="${state.favorites.includes(w.id)?'Прибрати з':'Додати до'} обраного: ${attr(w.lt)}">${icon('star')}</button></article>`).join(''):'<div class="empty">Слів не знайдено. Спробуйте іншу тему або коротший запит.</div>');}
function startCards(mode){let queue;if(mode==='review'){queue=[...dueWords(),...newWords().slice(0,Math.max(0,10-dueWords().length))].slice(0,10);}else queue=shuffle(filteredWords()).slice(0,10);if(!queue.length){toast(mode==='review'?'На сьогодні повторення завершено. Можна потренувати картки у словнику.':'У цій добірці немає слів.');return;}previousPage=mode==='review'?'review':'words';cardSession={queue:queue.map(w=>w.id),pos:0,open:false,mode,ratings:0,initial:queue.length,start:Date.now(),counted:new Set()};page='cards';renderCard(true);}
function renderCard(focus=false){const s=cardSession;if(!s)return;const w=WORDS.find(w=>w.id===s.queue[s.pos]);if(!w){state.sessions++;save();renderResult({title:'Слова закріплено!',message:`Опрацьовано ${s.counted.size} карток. Складні слова з’являться знову раніше.`,correct:s.counted.size,total:s.counted.size,xp:s.ratings*5,returnTo:previousPage,kind:'cards',seconds:(Date.now()-s.start)/1000});return;}const reversed=wordDirection==='uk';paint(`${subhead('Картки','exit-session')}<div class="row between small muted"><span>${CATEGORIES[w.cat]}</span><span>${s.pos+1} / ${s.queue.length}</span></div><div class="progress" style="margin-top:12px"><span style="width:${s.pos/s.queue.length*100}%"></span></div><div class="flash"><div class="card-tools">${(!reversed||s.open)?audioButton(w.lt):''}<button class="icon-btn ${state.favorites.includes(w.id)?'liked':''}" data-action="favorite" data-value="${w.id}" aria-label="Обране" aria-pressed="${state.favorites.includes(w.id)}">${icon('star')}</button></div><span class="eyebrow muted" style="margin-top:30px">${reversed?'УКРАЇНСЬКА → ЛИТОВСЬКА':'ЛИТОВСЬКА → УКРАЇНСЬКА'}</span><div class="word" lang="${reversed?'uk':'lt'}">${esc(reversed?w.uk:w.lt)}</div>${s.open?`<div class="translation" lang="${reversed?'lt':'uk'}">${esc(reversed?w.lt:w.uk)}</div><p class="small muted">${esc(w.note||'Спробуйте вимовити слово та скласти з ним просту фразу.')}</p>`:button('Показати відповідь','flip','','btn soft')}</div>${s.open?`<p class="small center muted" style="margin-bottom:12px">Як добре ви пригадали відповідь?</p><div class="rating">${button('Ще раз<small>через 10 хв</small>','rate','0','btn danger')}${button('Пам’ятаю<small>'+intervalLabel(w.id,1)+'</small>','rate','1','btn soft')}${button('Легко<small>'+intervalLabel(w.id,2)+'</small>','rate','2','btn primary')}</div>`:'<p class="center small muted">Спочатку пригадайте самостійно, тоді відкрийте переклад.</p>'}<p class="mode-note center">Складна картка повториться наприкінці цієї серії один раз.</p>`,focus);}
function intervalLabel(id,rating){const l=Math.min(5,(state.cards[id]?.level||0)+(rating===2?2:1));return ['10 хв','1 день','3 дні','7 днів','14 днів','30 днів'][l];}
function rateCard(rating){const s=cardSession;if(!s||!s.open)return;const id=s.queue[s.pos];updateCard(id,rating);award(rating>0,5);s.ratings++;if(rating===0&&s.queue.filter(x=>x===id).length<2)s.queue.push(id);s.counted.add(id);s.pos++;s.open=false;renderCard(true);}
function renderPractice(focus=false){paint(`${heading('ТРЕНАЖЕР · УРОК 2','Від слів до речень','Оберіть навичку. За кожною відповіддю — коротке пояснення.')}<div class="practice-grid">${[['verbs','bolt','green','Дієслова','10 форм за особами'],['genitive','repeat','blue','Звідки?','iš + родовий'],['locative','home','orange','Де?','Місцевий відмінок'],['build','chat','violet','Скласти фразу','Речення з блоків'],['typing','pen','blue','Написати форму','Дієслова та відмінки'],['listen','sound','orange','На слух','Потрібен литовський голос']].map(([id,ic,col,t,d])=>`<button class="practice-tile" data-action="quiz" data-value="${id}"><span class="tile-icon ${col}">${icon(ic)}</span><b>${t}</b><p>${d}</p></button>`).join('')}<button class="practice-tile" data-action="match"><span class="tile-icon green">${icon('match')}</span><b>Знайти пари</b><p>Слова та переклади</p></button><button class="practice-tile" data-action="dialogue" data-value="0"><span class="tile-icon violet">${icon('people')}</span><b>Мінідіалоги</b><p>Проживання, робота, мова</p></button></div><h3>Спочатку розберімося</h3><div class="stack">${button('Дієслово + особа → форма','verbdesk','','btn full')}${button('Назва → звідки → де','placedesk','','btn full')}</div><div class="spacer"></div>${button(icon('trophy')+' Підсумковий тест · 24 завдання','quiz','exam','btn dark full')}<div class="spacer"></div>${button(icon('repeat')+` Мої помилки · ${state.mistakes.length}`,'quiz','errors','btn full')}<h3>Моя коротка розповідь</h3><p class="small muted">Зразок: замініть місто та інші відомості на свої. Ім’я змінюється в профілі.</p><div class="quote" lang="lt" style="margin-top:14px"><span>Mano vardas ${esc(state.settings.name||'Jonas')}.</span><span>Aš esu iš Ukrainos.</span><span>Dabar gyvenu Kaune.</span><span>Šiek tiek kalbu lietuviškai.</span></div><div class="row" style="margin-top:12px">${audioButton(`Mano vardas ${state.settings.name||'Jonas'}. Aš esu iš Ukrainos. Dabar gyvenu Kaune. Šiek tiek kalbu lietuviškai.`)}<span class="small muted">Слухайте й повторюйте. Автоматичного оцінювання вимови немає.</span></div>`,focus);}

function prepareQuestion(q){return {...q,options:q.opts?shuffle(q.opts):[],tokens:q.tokens?shuffle(q.tokens):[]};}
function startQuiz(kind){let arr=[],title='Практика',module=null;
 if(kind.startsWith('module:')){module=Number(kind.split(':')[1]);if(!MODULES[module])return;state.read[module]=true;save();const core=QUESTIONS.filter(q=>q.m===module&&q.tag!=='vocab');const byTag={};for(const q of core)(byTag[q.tag]??=[]).push(q);const chosen=Object.values(byTag).map(a=>shuffle(a)[0]);arr=[...chosen,...shuffle(core).filter(q=>!chosen.some(c=>c.id===q.id))].slice(0,8);arr=shuffle(arr);title=MODULES[module].title;}
 else if(kind==='exam'){title='Підсумковий тест';MODULES.forEach(m=>{const core=QUESTIONS.filter(q=>q.m===m.id&&q.tag!=='vocab');arr.push(...shuffle(core).slice(0,3));});arr=shuffle(arr);}
 else if(kind==='errors'){arr=shuffle(QUESTIONS.filter(q=>state.mistakes.includes(q.id))).slice(0,15);title='Робота над помилками';}
 else if(kind==='typing'){arr=shuffle(QUESTIONS.filter(q=>q.type==='type')).slice(0,10);title='Пишемо литовською';}
 else if(kind==='build'){arr=shuffle(QUESTIONS.filter(q=>q.type==='build')).slice(0,10);title='Складаємо фрази';}
 else if(['verbs','genitive','locative'].includes(kind)){arr=shuffle(QUESTIONS.filter(q=>q.tag===({verbs:'verb',genitive:'genitive',locative:'locative'}[kind]))).slice(0,10);title={verbs:'Дієслова за особами',genitive:'Звідки? Iš + родовий',locative:'Де? Місцевий відмінок'}[kind];}
 else if(kind==='listen'){if(!getLTVoice()){toast('Литовський голос недоступний. У «Профілі» є посилання на записи носіїв мови.');return;}arr=shuffle(QUESTIONS.filter(q=>q.wordId&&WORDS.find(w=>w.id===q.wordId)?.lt.length<45)).slice(0,8).map(q=>({...q,type:'listen',q:'Послухайте та оберіть переклад.',audio:WORDS.find(w=>w.id===q.wordId).lt}));title='Слухаємо литовську';}
 else{const first=MODULES.map(m=>shuffle(QUESTIONS.filter(q=>q.m===m.id))[0]);arr=shuffle([...first,...shuffle(QUESTIONS).filter(q=>!first.some(c=>c.id===q.id)).slice(0,2)]);title='Швидка практика';}
 if(!arr.length){toast('Помилок для повторення ще немає. Почніть зі звичайної практики.');return;}previousPage=page==='lesson'?'home':'practice';quiz={kind,title,module,items:arr.map(prepareQuestion),i:0,correct:0,xp:0,start:Date.now(),answered:false,selection:null,selected:[],wrong:[],history:[]};page='quiz';renderQuiz(true);
}

function renderQuiz(focus=false){const s=quiz;if(!s)return;const q=s.items[s.i];let task='';if(q.type==='choice'||q.type==='listen'){task=`${q.type==='listen'?`<div class="row" style="margin-bottom:20px">${button(icon('sound')+' Послухати','speak',q.audio,'btn primary grow')}${button('Повільно','speak-slow',q.audio,'btn')}</div>`:''}<div class="options">${q.options.map((o,i)=>`<button class="option ${s.answered&&(o===q.a?'correct':o===s.selection?'wrong':'')}" data-action="answer" data-value="${attr(o)}" ${s.answered?'disabled':''}><span class="number">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;}else if(q.type==='type'){task=`<label class="sr-only" for="typedAnswer">Ваша відповідь литовською</label><input id="typedAnswer" class="search" lang="lt" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напишіть литовською…" value="${attr(s.selection||'')}" ${s.answered?'disabled':''}><div class="keypad">${'ąčęėįšųūž'.split('').map(c=>`<button data-action="key" data-value="${c}" ${s.answered?'disabled':''}>${c}</button>`).join('')}</div>${!s.answered?`<div class="answer-bar">${button('Перевірити','check-type','','btn primary full')}</div><p class="mode-note">Регістр і пунктуація не впливають на оцінку. Діакритичні знаки — важливі.</p>`:''}`;}else{task=`<div class="sentence-zone" aria-label="Складене речення">${s.selected.length?s.selected.map(i=>`<button class="token" data-action="remove-token" data-value="${i}" ${s.answered?'disabled':''}>${esc(q.tokens[i])}</button>`).join(''):'<p>Торкніться слів унизу, щоб скласти речення.</p>'}</div><div class="token-bank">${q.tokens.map((t,i)=>`<button class="token" data-action="token" data-value="${i}" ${s.answered||s.selected.includes(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div>${!s.answered?`<div class="answer-bar">${button('Перевірити речення','check-build','','btn primary full')}</div>`:''}`;}
 paint(`<div class="quiz-head">${button(icon('close'),'exit-session','','icon-btn')}<div class="progress" role="progressbar" aria-label="Прогрес тренування" aria-valuenow="${s.i}" aria-valuemin="0" aria-valuemax="${s.items.length}"><span style="width:${s.i/s.items.length*100}%"></span></div><span class="small muted">${s.i+1}/${s.items.length}</span></div><p class="question-label">${esc(s.title)}</p><h2 class="question">${esc(q.q)}</h2>${task}${s.answered?`<section class="feedback ${s.lastOK?'':s.near?'near':'bad'}" aria-live="polite"><h3>${s.lastOK?'Чудово! Правильно.':s.near?'Майже! Перевірте літери.':'Спробуємо запам’ятати'}</h3>${s.lastOK?'':`<p><b>Правильно: <span lang="lt">${esc(q.a)}</span></b></p>`}<p>${esc(q.explain)}</p>${button(s.i+1===s.items.length?'Показати результат':'Далі','next-question','','btn '+(s.lastOK?'primary':'dark')+' full')}</section>`:''}`,focus);
}
function checkAnswer(answer){const s=quiz;if(!s||s.answered)return;const q=s.items[s.i];if(!norm(answer)){toast('Спочатку введіть відповідь або складіть речення.');return;}s.answered=true;s.selection=answer;const accepted=[q.a,...(q.aliases||[])];const ok=accepted.some(a=>norm(a)===norm(answer));s.near=!ok&&accepted.some(a=>loose(a)===loose(answer));s.lastOK=ok;if(ok){s.correct++;s.xp+=10;state.mistakes=state.mistakes.filter(id=>id!==q.id);}else{s.xp+=2;s.wrong.push(q.id);if(!state.mistakes.includes(q.id))state.mistakes.push(q.id);}if(q.wordId)updateCard(q.wordId,ok?1:0);s.history.push({q:q.q,answer,correct:q.a,ok});award(ok);playTone(ok);renderQuiz();announce(ok?'Правильно.':`Правильна відповідь: ${q.a}`);const feedback=main.querySelector('.feedback');if(feedback)feedback.scrollIntoView({behavior:'smooth',block:'nearest'});}
function nextQuestion(){const s=quiz;if(!s||!s.answered)return;s.i++;if(s.i>=s.items.length){const score=Math.round(s.correct/s.items.length*100);if(s.module!==null)state.completed[s.module]=Math.max(state.completed[s.module]||0,score);if(s.kind==='exam')state.examBest=Math.max(state.examBest,score);state.sessions++;save();renderResult({title:score>=80?'Гарна робота!':'Ще трохи практики',message:s.module!==null?(score>=80?'Блок засвоєно. Наступний крок уже чекає!':'Для позначки «Засвоєно» потрібно 80%. Повторіть пояснення та спробуйте знову.'):s.kind==='exam'?(score>=80?'Ви впевнено орієнтуєтеся в матеріалі уроку 2.':'Перегляньте пояснення помилок і повторіть складні теми.'):'Кожна спроба допомагає запам’ятати матеріал.',correct:s.correct,total:s.items.length,xp:s.xp,seconds:(Date.now()-s.start)/1000,returnTo:previousPage,kind:s.kind,wrong:s.wrong,history:s.history,module:s.module});}else{s.answered=false;s.selection=null;s.selected=[];renderQuiz(true);}}
let lastResult=null;
function renderResult(r){lastResult=r;page='result';const score=r.total?Math.round(r.correct/r.total*100):0;paint(`<div class="center"><div class="result-medal">${icon(r.kind==='cards'?'book':'trophy')}</div><p class="eyebrow muted">${r.kind==='cards'?'ПОВТОРЕННЯ ЗАВЕРШЕНО':'ТРЕНУВАННЯ ЗАВЕРШЕНО'}</p><h1 style="margin:12px 0">${r.title}</h1><p class="muted" style="font-size:14px">${r.message}</p></div><div class="result-grid"><div><b>${r.kind==='cards'?r.correct:score+'%'}</b><span>${r.kind==='cards'?'карток':'правильно'}</span></div><div><b>+${r.xp}</b><span>балів XP</span></div><div><b>${Math.max(1,Math.round(r.seconds/60))}</b><span>хвилин</span></div></div><div class="stack">${r.wrong?.length?button('Повторити помилки · '+r.wrong.length,'retry-wrong','','btn primary full'):''}${r.module!==null&&r.module!==undefined&&r.module<MODULES.length-1&&score>=80?button('Наступний блок','lesson',r.module+1,'btn primary full'):''}${button('До маршруту уроку','nav','home','btn '+(!r.wrong?.length?'primary ':'')+'full')}${button('До '+(r.returnTo==='review'?'повторення':r.returnTo==='words'?'словника':'вправ'),'nav',r.returnTo==='home'?'practice':r.returnTo,'btn full')}</div>${r.history?`<details style="margin-top:22px"><summary>Переглянути відповіді</summary>${r.history.map(h=>`<div class="setting"><p><b>${h.ok?'✓':'○'} ${esc(h.q)}</b></p><p>Ваша відповідь: ${esc(h.answer)}</p>${h.ok?'':`<p style="color:#397b1b">Правильно: ${esc(h.correct)}</p>`}</div>`).join('')}</details>`:''}`,true);}
function retryWrong(){if(!lastResult?.wrong?.length)return;const items=lastResult.wrong.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);quiz={kind:'errors',title:'Закріплюємо складне',module:null,items:shuffle(items).map(prepareQuestion),i:0,correct:0,xp:0,start:Date.now(),answered:false,selection:null,selected:[],wrong:[],history:[]};previousPage='practice';page='quiz';renderQuiz(true);}
function startMatch(){const available=WORDS.filter(w=>['core','people','being','forms','origin','location','countries','cities','places','phrases'].includes(w.cat)&&w.lt.length<25&&w.uk.length<30);let unique=[];for(const w of shuffle(available)){if(!unique.some(x=>x.uk===w.uk))unique.push(w);if(unique.length===5)break;}matching={left:unique,right:shuffle(unique),selected:null,matched:[],wrong:null,attempts:0,firstCorrect:0,busy:false,start:Date.now(),xp:0};page='matching';renderMatch(true);}
function renderMatch(focus=false){const s=matching;paint(`${subhead('Знайдіть 5 пар','exit-session')}<p class="muted small">Торкніться слова зліва та його перекладу справа. Пари залишаються на своїх місцях.</p><div class="row between" style="margin-top:18px"><b>Знайдено ${s.matched.length} / 5</b><span class="small muted">Спроб: ${s.attempts}</span></div><div class="match-board">${['left','right'].map(side=>`<div class="match-col">${s[side].map(w=>`<button class="match-tile ${s.matched.includes(w.id)?'matched':''} ${s.selected?.side===side&&s.selected.id===w.id?'selected':''} ${s.wrong?.some(x=>x.id===w.id&&x.side===side)?'wrong':''}" data-action="pair" data-value="${side}:${w.id}" ${s.matched.includes(w.id)||s.busy?'disabled':''} lang="${side==='left'?'lt':'uk'}">${esc(side==='left'?w.lt:w.uk)}</button>`).join('')}</div>`).join('')}</div>`,focus);}
function choosePair(value){const s=matching;if(!s||s.busy)return;const [side,id]=value.split(':');if(s.matched.includes(id))return;if(!s.selected||s.selected.side===side){s.selected={side,id};renderMatch();return;}s.attempts++;const ok=s.selected.id===id;if(ok){s.matched.push(id);s.xp+=10;updateCard(id,1);award(true);s.selected=null;playTone(true);if(s.matched.length===5){state.sessions++;save();renderResult({title:'Усі пари знайдено!',message:'Спробуйте вимовити слова без підказок.',correct:5,total:s.attempts,xp:s.xp,seconds:(Date.now()-s.start)/1000,returnTo:'practice',kind:'match'});return;}renderMatch();}else{s.wrong=[s.selected,{side,id}];s.busy=true;s.xp+=2;award(false);playTone(false);announce('Це різні слова. Спробуйте ще раз.');renderMatch();setTimeout(()=>{if(matching!==s||page!=='matching')return;s.wrong=null;s.selected=null;s.busy=false;renderMatch();},700);}}
function startDialogue(i){dialogue={index:i,step:0,answered:false,answer:null,correct:0,xp:0,start:Date.now()};page='dialogue';renderDialogue(true);}
function renderDialogue(focus=false){const s=dialogue;const d=DIALOGUES[s.index],step=d.steps[s.step];if(!s.options)s.options=shuffle([step.a,...step.opts]);paint(`${subhead('Мінідіалог','exit-session')}<div class="chips">${DIALOGUES.map((d,i)=>button(d.label,'dialogue',i,'chip '+(i===s.index?'active':''))).join('')}</div><p class="eyebrow muted">${d.title} · ${s.step+1}/${d.steps.length}</p><div class="dialogue-prompt"><div class="avatar">${icon('person')}</div><div class="bubble"><b lang="lt">${step.lt}</b><p class="muted">${step.uk}</p>${audioButton(step.lt)}</div></div><h3>Що відповісте?</h3><div class="options">${s.options.map(o=>`<button class="option ${s.answered&&(o===step.a?'correct':o===s.answer?'wrong':'')}" data-action="dialogue-answer" data-value="${attr(o)}" ${s.answered?'disabled':''}><span lang="lt">${o}</span></button>`).join('')}</div>${s.answered?`<section class="feedback ${s.answer===step.a?'':'bad'}"><h3>${s.answer===step.a?'Саме так!':'Доречна відповідь:'}</h3>${s.answer===step.a?'':`<p lang="lt"><b>${step.a}</b></p>`}<p>${step.why}</p>${button('Далі','dialogue-next','','btn primary full')}</section>`:''}`,focus);}
function answerDialogue(value){const s=dialogue;if(!s||s.answered)return;s.answer=value;s.answered=true;const ok=value===DIALOGUES[s.index].steps[s.step].a;if(ok)s.correct++;s.xp+=ok?10:2;award(ok);playTone(ok);renderDialogue();}
function nextDialogue(){const s=dialogue;if(!s?.answered)return;s.step++;if(s.step>=DIALOGUES[s.index].steps.length){state.sessions++;save();renderResult({title:'Розмову завершено!',message:'Тепер повторіть репліки вголос і назвіть власне ім’я.',correct:s.correct,total:s.step,xp:s.xp,seconds:(Date.now()-s.start)/1000,returnTo:'practice',kind:'dialogue'});}else{s.answered=false;s.answer=null;s.options=null;renderDialogue(true);}}
function weekCalendar(){return `<div class="calendar-week">${Array.from({length:7},(_,i)=>{const date=dayOffset(i-6),d=new Date(date+'T12:00:00');return `<div class="calendar-day ${state.days[date]?.attempts?'done':''} ${i===6?'today':''}"><span>${d.toLocaleDateString('uk-UA',{weekday:'short'})}</span><b>${d.getDate()}</b></div>`;}).join('')}</div>`;}
function renderReview(focus=false){const due=dueWords().length,learned=mastered(),fresh=newWords().length;const future=WORDS.map(w=>state.cards[w.id]?.due).filter(x=>x>Date.now()).sort((a,b)=>a-b)[0];paint(`${heading('ЗАКРІПЛЮЄМО','Пам’ятати надовго','Повертайтеся до слів, перш ніж вони забудуться.')}<div class="card"><div class="review-stat"><div class="ring" style="--p:${learned/WORDS.length*100}%"><span>${learned}</span></div><div><b>Слів закріплено</b><p class="small muted" style="margin-top:6px">із ${WORDS.length} у цьому уроці<br>Рівень повторення 3 або вище</p></div></div><div class="result-grid" style="margin:20px 0"><div><b>${due}</b><span>час повторити</span></div><div><b>${fresh}</b><span>нових</span></div><div><b>${state.mistakes.length}</b><span>помилок</span></div></div>${button('Повторити до 10 карток','review-start','','btn primary full')}<p class="mode-note">Спочатку картки, час яких настав, потім до 10 нових. ${!due&&future?'Найближче повторення: '+new Date(future).toLocaleString('uk-UA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'.':''}</p></div><div class="spacer"></div>${button(icon('repeat')+' Повернутися до помилок','quiz','errors','btn full')}<h3>Ваш навчальний ритм</h3><div class="card"><div class="row between"><b>${streak()} дн. поспіль</b><span class="small muted">Останні 7 днів</span></div>${weekCalendar()}</div><h3>Нагадування на телефоні</h3><div class="card"><p class="small muted">Створіть подію для календаря: 10 хвилин литовської щодня протягом 30 днів.</p><div class="settings-grid" style="margin-top:16px"><div><label class="small" for="reminderDate">Початок</label><input type="date" id="reminderDate" value="${today()}" required></div><div><label class="small" for="reminderTime">Час</label><input type="time" id="reminderTime" value="${state.settings.reminder}" required></div></div><div class="spacer"></div>${button(icon('calendar')+' Додати до календаря (.ics)','calendar','','btn full')}<p class="mode-note">Завантажте та імпортуйте файл .ics у календар. Він містить щоденне нагадування за 10 хвилин до заняття. Час — місцевий час календаря. Сам HTML-файл не надсилає сповіщень, коли закритий; сповіщеннями керує календар.</p></div><details style="margin-top:20px"><summary>Як працює повторення</summary><p>«Ще раз» повертає картку через 10 хвилин і один раз наприкінці поточної серії. «Пам’ятаю» підвищує рівень на 1, «Легко» — на 2.</p><p>Інтервали рівнів: 10 хвилин → 1 → 3 → 7 → 14 → 30 днів. Це проста схема повторення; позначка «закріплено» не гарантує довготривалої пам’яті.</p><p>Нові слова не зараховуються як прострочені. Спроби та бали додаються лише за відповіді, а не за відкриття сторінки.</p></details>`,focus);}
function sourceDetails(){return `<details><summary>Джерела та зміст уроку</summary><p><b>Основа:</b> Deimantė Cibulskienė, VDU, «LKK_VDU_II paskaita_2026_10_15.pdf», 21 сторінка. Навчальні пояснення перекладено українською; вправи створено для цього застосунку.</p><p>С. 5–6: словник і три основні форми; 7–14: дієслова; 15, 18: iš і родовий; 16–17: система відмінків; 19–20: місцевий; 21: міста й країни. Заповнено мовні форми з таблиці та додано практичні речення.</p><p><b>Уточнення:</b> studijuoja належить до I дієвідміни (-a); загальне -is → -io застосовується лише до відповідного типу іменників; Šiauliai — форма множини. Для Києва використано Kyjivas із поясненням варіанта Kijevas у PDF.</p><a href="https://50languages.com/uk/learn/phrasebook-lessons/166/lt" target="_blank" rel="noopener noreferrer">50languages · Країни і мови ↗</a><a href="https://50languages.com/uk/learn/phrasebook-lessons/184/lt" target="_blank" rel="noopener noreferrer">50languages · Вивчення іноземних мов ↗</a><p class="small muted">Звідси додано приклади Jis kalba angliškai, Prašau mane visada pataisyti та модель šiek tiek. Записи носіїв доступні на зовнішніх сторінках; аудіофайли не вбудовано.</p><a href="https://www.lrt.lt/naujienos/lietuvoje/2/1633894/vlkk-iteisino-du-ukrainos-sostines-pavadinimus-naujasis-pavadinimas-kyjivas" target="_blank" rel="noopener noreferrer">LRT · Нормативний варіант Kyjivas (рішення VLKK) ↗</a><a href="https://hmf.vdu.lt/lietuviu-kalbos-mokymo-priemone/" target="_blank" rel="noopener noreferrer">VDU · Платформа з матеріалу уроку ↗</a><p class="small muted">Джерела переглянуто 16.10.2026. Застосунок не пов’язаний із Duolingo.</p></details><details><summary>Як працювати з другим уроком</summary><p>Спочатку пройдіть блоки 1–3 про слова й дієслова. Далі порівняйте «звідки?» та «де?». Наприкінці відкрийте довідник назв, мінідіалоги й підсумковий тест.</p><p>Сторінки 2–3 PDF містять організаційні відомості про платформу та іспити. Для умов реєстрації й актуальних вимог звертайтеся до викладачки або відповідної установи. До мовних тестів ці відомості не включено.</p></details>`;}

function renderProfile(focus=false){const completed=MODULES.filter(m=>state.completed[m.id]>=80).length;paint(`${heading('ВАШ ПРОГРЕС','Маленькі перемоги','Усе зберігається в цьому браузері на цьому пристрої.')}<div class="card"><div class="row"><div class="avatar" style="width:58px;height:58px;border-radius:20px">${icon('person')}</div><div><h2>${esc(state.settings.name||'Учень / учениця')}</h2><p class="small muted">Урок 2 · Gyvenu, dirbu, kalbu</p></div></div><div class="result-grid" style="margin:20px 0 0"><div><b>${state.xp}</b><span>балів XP</span></div><div><b>${completed}/${MODULES.length}</b><span>блоків</span></div><div><b>${state.examBest}%</b><span>кращий тест</span></div></div></div><h3>Досягнення</h3><div class="stack">${[[state.sessions>0,'Перший крок','Завершити одну серію вправ.','star'],[streak()>=3,'Три дні разом','Займатися 3 дні поспіль.','flame'],[completed===MODULES.length,'Урок засвоєно','Набрати 80% у кожному блоці.','trophy']].map(([ok,t,d,i])=>`<div class="achievement ${ok?'':'locked'}">${icon(i)}<div><b>${t}${ok?' ✓':''}</b><p>${d}</p></div></div>`).join('')}</div><h3>Налаштування</h3><div class="card"><div class="setting"><label for="profileName">Ваше ім’я латиницею</label><input class="search" id="profileName" maxlength="60" value="${attr(state.settings.name)}" autocomplete="given-name"><p class="mode-note">Для фрази «Mano vardas…». Використовуйте звичне написання свого імені.</p></div><div class="setting"><label for="dailyGoal">Денна ціль</label><select id="dailyGoal">${[5,10,15,20].map(n=>`<option value="${n}" ${n===state.settings.goal?'selected':''}>${n} відповідей або карток</option>`).join('')}</select></div><div class="setting"><div class="row"><label for="largeText">Збільшений текст</label><input type="checkbox" id="largeText" ${state.settings.large?'checked':''}></div></div><div class="setting"><div class="row"><label for="soundEffects">Звуки правильних відповідей</label><input type="checkbox" id="soundEffects" ${state.settings.sound?'checked':''}></div></div></div><h3>Озвучення</h3><div class="card"><p class="small" id="voiceStatus">${voiceStatus()}</p><div class="setting"><label for="speechRate">Швидкість мовлення</label><select id="speechRate">${[[.7,'Повільно'],[.85,'Помірно'],[1,'Звичайно']].map(([r,t])=>`<option value="${r}" ${Math.abs(state.settings.rate-r)<.01?'selected':''}>${t}</option>`).join('')}</select></div>${button(icon('sound')+' Спробувати: Laba diena!','speak','Laba diena!','btn full')}<p class="mode-note">Це синтез мовлення, а не запис викладача. Доступність, наголос і робота без інтернету залежать від голосів вашої системи. За відсутності литовського голосу іншу мову не підставляємо.</p><a href="https://50languages.com/uk/learn/phrasebook/lt" target="_blank" rel="noopener noreferrer" class="small">Слухати носіїв на 50languages ↗</a></div><h3>Копія прогресу</h3><div class="card stack"><p class="small muted">Очищення даних браузера або переміщення HTML-файлу може прибрати доступ до прогресу. Зберігайте копію для перенесення на інший пристрій.</p>${button(icon('download')+' Зберегти копію прогресу','export','','btn full')}${button('Відновити з копії (.json)','import','','btn full')}${button('Скинути прогрес уроку','reset','','btn danger full')}</div><div class="spacer"></div><details><summary>Як користуватися файлом</summary><ol class="help-list"><li>Завантажте index.html і відкрийте його у браузері. Переглядач файлів або вкладень може блокувати JavaScript.</li><li>У «Уроці» прочитайте пояснення та пройдіть перевірку. Для позначки «Засвоєно» потрібно щонайменше 80%.</li><li>У «Словах» оберіть тему, відкрийте картки й оцініть пригадування.</li><li>Щодня відкривайте «Повтор». Для нагадувань імпортуйте подію в календар.</li><li>Для розміщення на GitHub Pages достатньо цього index.html у корені опублікованої папки. Обліковий запис і серверна база даних застосунку не потрібні.</li></ol><p>Усі тексти, стилі та вправи містяться в одному файлі. Посилання на зовнішні джерела потребують інтернету. Власні бали й позначки не синхронізуються між браузерами автоматично.</p></details>${sourceDetails()}<p class="small center muted" style="margin-top:22px">Labas! · Урок 2 · версія 1.0<br>Починайте з малого. Повертайтеся щодня.</p>`,focus);}
function getLTVoice(){if(!('speechSynthesis'in window))return null;const list=window.speechSynthesis.getVoices();if(list.length)voices=list;return voices.find(v=>/^lt(?:-|$)/i.test(v.lang.replace(/_/g,'-'))&&v.localService)||voices.find(v=>/^lt(?:-|$)/i.test(v.lang.replace(/_/g,'-')))||null;}
function voiceStatus(){const voice=getLTVoice();return voice?`Литовський голос доступний: <b>${esc(voice.name)}</b>. ${voice.localService?'Голос позначено системою як локальний.':'Голос може потребувати інтернету.'}`:'Литовський голос поки недоступний в цьому браузері. Усі текстові вправи працюють. Слухайте носіїв за посиланням нижче або перевірте доступні голоси у налаштуваннях пристрою.';}
function speak(text,slow=false){const voice=getLTVoice();if(!voice||!('SpeechSynthesisUtterance'in window)){toast('Литовського голосу немає. У «Профілі» є посилання на записи носіїв мови.');return;}window.speechSynthesis.cancel();const u=new window.SpeechSynthesisUtterance(String(text));u.lang='lt-LT';u.voice=voice;u.rate=slow?.65:state.settings.rate;u.pitch=1;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('Не вдалося відтворити голос. Перевірте звук і доступність голосу в системі.');};window.speechSynthesis.speak(u);}
let audioContext=null;
function playTone(ok){if(!state.settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.type='sine';o.frequency.setValueAtTime(ok?640:240,audioContext.currentTime);o.frequency.exponentialRampToValueAtTime(ok?850:180,audioContext.currentTime+.12);g.gain.setValueAtTime(.035,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);o.start();o.stop(audioContext.currentTime+.21);}catch(e){}}
function confirmAction(title,message){return new Promise(resolve=>{const d=document.getElementById('confirmDialog');document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmText').textContent=message;const finish=val=>{if(d.open)d.close();resolve(val);};document.getElementById('confirmYes').onclick=()=>finish(true);document.getElementById('confirmNo').onclick=()=>finish(false);d.oncancel=e=>{e.preventDefault();finish(false);};if(typeof d.showModal==='function')d.showModal();else resolve(window.confirm(title+'\n'+message));});}
function downloadFile(name,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportProgress(){downloadFile('labas-lesson-2-progress-'+today()+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');toast('Копію прогресу підготовлено до завантаження.');}
function icsEscape(s){return s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function foldICS(line){const encoder=new TextEncoder();let out=[],part='',count=0;for(const ch of line){const len=encoder.encode(ch).length;if(count+len>73){out.push(part);part=' ';count=1;}part+=ch;count+=len;}out.push(part);return out.join('\r\n');}
function makeICS(date,time){const start=new Date(date+'T'+time+':00');if(Number.isNaN(start.getTime()))throw Error('Перевірте дату й час.');const end=new Date(start.getTime()+10*60000);const stamp=d=>today(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';const uid='labas-lesson-2-'+date.replace(/-/g,'')+'-'+time.replace(':','')+'@local';return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Labas Lesson 2//UK','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+uid,'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+stamp(start),'DTEND:'+stamp(end),'RRULE:FREQ=DAILY;COUNT=30','SUMMARY:'+icsEscape('Литовська · Урок 2 · 10 хвилин'),'DESCRIPTION:'+icsEscape('Відкрийте свій index.html → Повтор. Повторіть до 10 карток і 5 речень уголос. Прогрес зберігається у вашому браузері.'),'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Час повторити литовську!'),'END:VALARM','END:VEVENT','END:VCALENDAR'].map(foldICS).join('\r\n')+'\r\n';}
function calendarDownload(){const date=document.getElementById('reminderDate').value,time=document.getElementById('reminderTime').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){toast('Оберіть дату початку й час.');return;}state.settings.reminder=time;save();downloadFile('labas-lesson-2-reminder.ics',makeICS(date,time),'text/calendar;charset=utf-8');toast('Файл календаря підготовлено. Відкрийте його та підтвердьте імпорт у календарі.');}
async function exitSession(){const confirmed=await confirmAction('Завершити цю серію?','Уже отримані бали й повторення збережені. Незавершена серія не зараховується як пройдений блок.');if(confirmed)navigate(page==='cards'?previousPage:'practice');}
document.getElementById('app').addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,value=el.dataset.value||'';
 switch(action){
 case 'nav':if(['quiz','cards','matching','dialogue'].includes(page)){if(!await confirmAction('Перейти до іншого розділу?','Бали й відповіді збережено, але поточну серію буде завершено.'))return;}navigate(value);break;
 case 'lesson':renderLesson(Number(value));break;
 case 'verbdesk':verbDesk();break;
 case 'placedesk':placeDesk();break;
 case 'person-id':if(PERSONS[Number(value)]){selectedPerson=Number(value);renderVerbExplorer();}break;
 case 'place-toggle':placeVisible=!placeVisible;renderPlaceExplorer();break;
 case 'place-group':if(['core','countries','cities','places'].includes(value)){placeGroup=value;selectedPlace=PLACES.findIndex(p=>value==='core'?p.level==='core':p.cat===value);placeVisible=true;renderPlaceExplorer();}break;
 case 'module-words':wordFilter='module:'+value;wordQuery='';navigate('words');break;
 case 'filter':wordFilter=value;renderWords();break;
 case 'direction':wordDirection=wordDirection==='lt'?'uk':'lt';renderWords();break;
 case 'favorite':state.favorites=state.favorites.includes(value)?state.favorites.filter(x=>x!==value):[...state.favorites,value];save();if(page==='words')renderWordList();else if(page==='cards')renderCard();break;
 case 'cards-filter':startCards('filter');break;
 case 'review-start':startCards('review');break;
 case 'flip':if(cardSession){cardSession.open=true;renderCard();}break;
 case 'rate':rateCard(Number(value));break;
 case 'quiz':startQuiz(value);break;
 case 'answer':checkAnswer(value);break;
 case 'check-type':checkAnswer(document.getElementById('typedAnswer').value);break;
 case 'key':{const inp=document.getElementById('typedAnswer');if(!inp||inp.disabled)return;const start=inp.selectionStart??inp.value.length,end=inp.selectionEnd??start;inp.setRangeText(value,start,end,'end');inp.focus();break;}
 case 'token':if(quiz&&!quiz.answered&&!quiz.selected.includes(Number(value))){quiz.selected.push(Number(value));renderQuiz();}break;
 case 'remove-token':if(quiz&&!quiz.answered){quiz.selected=quiz.selected.filter(i=>i!==Number(value));renderQuiz();}break;
 case 'check-build':if(quiz)checkAnswer(quiz.selected.map(i=>quiz.items[quiz.i].tokens[i]).join(' '));break;
 case 'next-question':nextQuestion();break;
 case 'retry-wrong':retryWrong();break;
 case 'exit-session':exitSession();break;
 case 'match':startMatch();break;
 case 'pair':choosePair(value);break;
 case 'dialogue':startDialogue(Number(value));break;
 case 'dialogue-answer':answerDialogue(value);break;
 case 'dialogue-next':nextDialogue();break;
 case 'speak':speak(value);break;
 case 'speak-slow':speak(value,true);break;
 case 'calendar':calendarDownload();break;
 case 'export':exportProgress();break;
 case 'import':document.getElementById('importFile').click();break;
 case 'reset':if(await confirmAction('Скинути весь прогрес уроку 2?','Бали, картки, обрані слова й результати цього уроку буде видалено. Спершу можна зберегти копію прогресу.')){state=defaults();save();navigate('home');toast('Прогрес уроку 2 скинуто.');}break;
 }
});
document.getElementById('app').addEventListener('input',e=>{if(e.target.id==='wordSearch'){wordQuery=e.target.value;renderWordList();}if(e.target.id==='profileName'){state.settings.name=e.target.value.slice(0,60);save();}});
document.getElementById('app').addEventListener('change',e=>{const el=e.target;if(el.id==='verbSelect'){if(VERBS[Number(el.value)])selectedVerb=Number(el.value);renderVerbExplorer();return;}if(el.id==='placeSelect'){if(PLACES[Number(el.value)])selectedPlace=Number(el.value);renderPlaceExplorer();return;}if(el.id==='dailyGoal')state.settings.goal=Number(el.value);else if(el.id==='speechRate')state.settings.rate=Number(el.value);else if(el.id==='soundEffects')state.settings.sound=el.checked;else if(el.id==='largeText'){state.settings.large=el.checked;document.documentElement.classList.toggle('large-text',el.checked);}else return;save();});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typedAnswer'&&quiz&&!quiz.answered){e.preventDefault();checkAnswer(e.target.value);}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('Файл завеликий для копії прогресу.');const imported=validateState(JSON.parse(await file.text()));if(await confirmAction('Відновити прогрес із копії?',`Поточні результати буде замінено. У копії: ${imported.xp} XP та ${Object.keys(imported.cards).length} карток.`)){state=imported;save();navigate('profile');toast('Прогрес відновлено.');}}catch(err){toast('Не вдалося прочитати копію: '+(err.message||'невідомий формат'));}});
if('speechSynthesis'in window){const reload=()=>{voices=window.speechSynthesis.getVoices();const status=document.getElementById('voiceStatus');if(status)status.innerHTML=voiceStatus();};window.speechSynthesis.addEventListener('voiceschanged',reload);reload();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&['home','review'].includes(page))renderPage(false);});
renderPage();

</script>
